# AcademicCore CI — único pipeline canónico (D4).
#
# Flujo reproducible:
#   checkout -> setup Python -> instalación pineada -> compileall
#   -> pytest (suite válida, sin bypasses) -> build sdist+wheel -> artefacto dist/
#
# Sin secretos, sin `|| true`, sin `continue-on-error`, sin exclusiones
# indiscriminadas. La única exclusión es `-m "not external"`, declarada en
# docs/testing/STRATEGY.md (runtimes vivos nunca bloquean el gate).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  test:
    name: test (${{ matrix.os }}, py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install (pinned)
        run: pip install -r requirements-lock.txt

      - name: Install package (editable, no new deps)
        run: pip install -e . --no-deps

      - name: Static check (compile all)
        run: python -m compileall -q src

      - name: Pytest (suite válida, sin bypasses)
        run: python -m pytest -m "not external" -q

  package:
    name: package (ubuntu, py 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build frontend
        run: pip install build

      - name: Build sdist+wheel
        run: python -m build

      - name: Verify artefacts exist
        run: python -c "import glob; s=glob.glob('dist/*.tar.gz'); w=glob.glob('dist/*.whl'); assert s and w, (s,w); print('\n'.join(sorted(s+w)))"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: academic-core-dist
          path: dist/
